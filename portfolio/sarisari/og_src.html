<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Bungee&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;
  background:
    repeating-linear-gradient(45deg,rgba(156,74,47,.06) 0 2px,transparent 2px 18px),
    repeating-linear-gradient(-45deg,rgba(156,74,47,.06) 0 2px,transparent 2px 18px),
    #F1E9DC;
  display:flex;flex-direction:column;justify-content:space-between;font-family:sans-serif}
.marquee{background:#9C4A2F;color:#F7F2EA;font-family:"Bungee";font-size:20px;letter-spacing:.16em;
  text-align:center;padding:16px;border-top:5px solid #DFA32E;border-bottom:5px solid #DFA32E;white-space:nowrap}
.marquee .st{color:#DFA32E;padding:0 .5em}
.mid{text-align:center;padding:0 40px}
.kick{font-family:"JetBrains Mono";font-size:19px;letter-spacing:.3em;color:#6E5A4C;text-transform:uppercase}
h1{font-family:"Fugaz One";font-size:150px;line-height:1;color:#9C4A2F;margin:12px 0 10px;
  text-shadow:5px 5px 0 #DFA32E,10px 10px 0 rgba(42,27,18,.15)}
.mean{font-size:30px;font-weight:600;color:#2A1B12;font-family:"Helvetica Neue",sans-serif}
</style></head>
<body>
<div class="marquee">SARI-SARI <span class="st">★</span> 5700 WURZBACH <span class="st">★</span> LEON VALLEY <span class="st">★</span> THIRTY YEARS</div>
<div class="mid">
  <div class="kick">A plan for Sari-Sari</div>
  <h1>PASALUBONG</h1>
  <div class="mean">What you bring back for the people who stayed home.</div>
</div>
<div class="marquee">GOD BLESS OUR TRIP <span class="st">★</span> THE FEED FOR FILIPINO SAN ANTONIO</div>
</body></html>
