<!DOCTYPE html>
<html lang="en">

<title>you're on the list · Photoshoots</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--ink:#151310;--pink:#f85ad8;--dim:#6d6068;--line:#f0d8ec}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,sans-serif;
     font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
     -webkit-tap-highlight-color:rgba(248,90,216,.18)}
.wrap{max-width:560px;margin:0 auto;padding:0 22px;position:relative}
.kao{white-space:nowrap;display:inline-block;font-family:-apple-system,"Hiragino Sans","Apple SD Gothic Neo","Apple Symbols",Menlo,sans-serif}
.airmail{height:15px;background:repeating-linear-gradient(-45deg,
   var(--pink) 0 11px, var(--paper) 11px 22px, var(--ink) 22px 33px, var(--paper) 33px 44px)}
h1{font-family:'Lobster',cursive;font-weight:400;font-size:clamp(38px,11vw,58px);
   line-height:1.05;margin:18px 0 4px}
h1 .hrt{color:var(--pink);font-size:.4em;vertical-align:.62em;margin-left:.05em;
  font-family:Georgia,serif;font-weight:800;-webkit-text-stroke:.028em var(--ink)}
.stamped{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:var(--pink);
  border:3px double var(--pink);border-radius:4px;padding:7px 12px;transform:rotate(-2deg);
  margin:6px 0 18px}
.card{border:3px solid var(--ink);box-shadow:6px 7px 0 rgba(21,19,16,.14);
  padding:22px 20px;margin:10px 0 26px;background:var(--paper)}
.card p{margin-bottom:12px;font-size:15.5px}
.card p:last-child{margin-bottom:0}
.card b{color:var(--pink)}
.dm{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
  border:3px solid var(--pink);padding:12px 14px;margin-top:16px;font-weight:700;
  background:repeating-linear-gradient(-45deg,rgba(248,90,216,.09) 0 7px,transparent 7px 14px)}
.dm svg{width:24px;height:24px;flex:0 0 24px;color:var(--pink)}
.dm span{margin-left:auto;color:var(--pink);font-size:20px}
.back{display:block;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;
  font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:22px 0 40px}
main{padding-top:26px;text-align:left}
.kaoline{color:var(--pink);font-size:18px;letter-spacing:2px;margin:4px 0 12px}
</style>
</head>
<body>
<div class="airmail"></div>
<main class="wrap">
  <h1>you're on the list<span class="hrt">&lt;3</span></h1>
  <div class="kaoline kao">⋆｡°✩ ₊˚ﾟ ♡</div>
  <span class="stamped">Received &middot; SATX</span>
  <div class="card">
    <p><b>got it.</b> I shoot these in rounds when I've got a free week, so it might
    be a while. you stay on the list either way.</p>
    <p>if I haven't hit you up and you're still down, just DM me.</p>
    <a class="dm" href="https://ig.me/m/vamppsych" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.25" fill="currentColor" stroke="none"/></svg>
      @vamppsych <span>&rarr;</span></a>
  </div>
  <a class="back" href="https://0fftheprint.com/hire/photoshoots/">&larr; back to the page</a>
</main>
<div class="airmail"></div>
</body>
</html>
