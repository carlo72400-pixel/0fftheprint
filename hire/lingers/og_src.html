<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- OG card source for /lingers/preview.jpg. Render:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
    --window-size=1200,630 --screenshot=og.png file:///.../lingers/og_src.html
  then sips -s format jpeg -s formatOptions 88 og.png --out preview.jpg -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#060a16;position:relative;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
body::before{content:"";position:absolute;inset:0;
background:
 radial-gradient(120% 75% at 50% -12%, rgba(30,72,190,.40), transparent 62%),
 radial-gradient(70% 45% at 50% 114%, rgba(224,34,52,.14), transparent 62%);}
/* the enneagram, lifted from his own GHZ / SPAW covers */
svg.geo{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:520px;height:520px;
opacity:.30;stroke:#e02234;fill:none;stroke-width:1.4}
.kick{font-family:"JetBrains Mono",monospace;color:#5c8cff;font-size:21px;letter-spacing:.44em;position:relative}
h1{font-family:"Anton",Impact,sans-serif;font-weight:400;color:#eceae4;font-size:118px;line-height:.88;
text-transform:uppercase;text-align:center;position:relative;letter-spacing:.005em;
text-shadow:0 0 60px rgba(30,72,190,.55), 0 6px 0 rgba(224,34,52,.30)}
h1 span{color:#e02234}
.strip{font-family:"JetBrains Mono",monospace;color:#eceae4;font-size:19px;letter-spacing:.16em;
border:2px solid #1d2a4d;border-radius:999px;padding:13px 32px;position:relative;
background:linear-gradient(180deg,rgba(30,72,190,.22),rgba(30,72,190,.05))}
.sideb{position:absolute;top:34px;left:40px;font-family:"JetBrains Mono",monospace;font-weight:700;
font-size:16px;letter-spacing:.3em;color:#e02234;border:1.5px solid #e02234;padding:7px 14px}
.bar{position:absolute;left:0;right:0;bottom:0;height:13px;
background:linear-gradient(90deg,#0f2f8f,#2f5fe0 28%,#e02234 68%,#0f2f8f)}
</style></head>
<body>
<svg class="geo" viewBox="0 0 200 200" aria-hidden="true">
  <circle cx="100" cy="100" r="92"/>
  <path d="M100 8 L28 152 L172 62 L28 62 L172 152 Z"/>
  <path d="M100 8 L169 148 L31 148 Z"/>
  <circle cx="100" cy="100" r="58"/>
</svg>
<div class="sideb">SIDE B</div>
<div class="kick">$IPOR &times; VAMPPSYCH</div>
<h1>The Side<br>That <span>Lingers</span></h1>
<div class="strip">HOUSTON &middot; SATX &middot; ATL &middot; SXSW MAR 2027</div>
<div class="bar"></div>
</body></html>
