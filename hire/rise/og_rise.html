<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- OG card source for /rise/preview.jpg. Render:
  Chrome --headless --window-size=1200,630 --screenshot=og.png file://.../og_rise.html
  then sips -s format jpeg -s formatOptions 88 og.png --out preview.jpg -->
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Permanent+Marker&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0e0713;position:relative;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
body::before{content:"";position:absolute;inset:0;
background:radial-gradient(120% 70% at 50% -10%, rgba(122,63,242,.22), transparent 62%),
radial-gradient(90% 50% at 50% 112%, rgba(210,169,79,.10), transparent 60%);}
.god{font-family:"Permanent Marker",cursive;color:#d2a94f;font-size:26px;letter-spacing:.14em;position:relative}
.kick{font-family:"JetBrains Mono",monospace;color:#9a5cff;font-size:22px;letter-spacing:.42em;position:relative}
h1{font-family:"Alfa Slab One",serif;font-weight:400;color:#ece4da;font-size:108px;line-height:.96;
text-transform:uppercase;text-align:center;position:relative;
text-shadow:0 5px 0 rgba(109,52,216,.55), 0 12px 40px rgba(0,0,0,.55)}
h1 span{color:#d2a94f}
.strip{font-family:"JetBrains Mono",monospace;color:#ece4da;font-size:21px;letter-spacing:.14em;
border:2px solid #2e2240;border-radius:999px;padding:14px 34px;position:relative;
background:linear-gradient(180deg,rgba(122,63,242,.18),rgba(122,63,242,.05))}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;
background:linear-gradient(90deg,#6d34d8,#9a5cff 30%,#d2a94f 70%,#6d34d8)}
</style></head>
<body>
<div class="god">GOD 1ST. ALWAYS.</div>
<div class="kick">KAVMAN &times; VAMPPSYCH</div>
<h1>The <span>Texas</span><br>Takeover</h1>
<div class="strip">ACL WKNDS &middot; SXSW 2027 &middot; THE ALBUM &middot; THE EXIT</div>
<div class="bar"></div>
</body></html>
