<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Event Photos · 0FF THE PRINT</title>
<meta name="description" content="Every night we shot. San Antonio venues, shows, raves, after hours. Find yours.">
<meta name="theme-color" content="#0a0a0d">
<meta property="og:type" content="website">
<meta property="og:title" content="EVENT PHOTOS · 0FF THE PRINT">
<meta property="og:description" content="Every night we shot. Find yours.">
<meta property="og:image" content="https://0fftheprint.com/assets/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/pack.css?v=3c0b0f68">
<link rel="stylesheet" href="../assets/css/binder.css?v=487bb4e0">
<script src="../assets/js/binder.js?v=b5792041" defer></script>
<style>
:root{--bg:#0a0a0d;--panel:#121218;--line:#23222b;--ink:#f4eef2;--muted:#9a93a3;
--pink:#f7b9dd;--pink-deep:#f48fc8;--pink-glow:#ff79c6;--dye-blue:#2f6bff;
--f-display:'Saira Condensed',sans-serif;--f-body:'Inter',system-ui,sans-serif;--f-mono:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.leopard-bar{height:14px;background:linear-gradient(90deg,var(--pink-deep),var(--pink) 25%,var(--dye-blue) 50%,var(--pink-deep) 75%,var(--pink))}
.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 70px}
.back{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:22px}
.back:hover{color:var(--pink-glow)}
h1{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
font-size:clamp(38px,8vw,88px);line-height:.92;letter-spacing:-.01em;
background:linear-gradient(180deg,#fff 10%,var(--pink) 45%,#8f8a97 60%,var(--pink-deep) 96%);
-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(255,121,198,.22))}
.sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:12px}
/* THE SHELF (10/3). Every night is a full-art party pack (its own photo printed on
   the pouch), the same tile the homepage rail uses (assets/css/pack.css). It was a list of rows.
   ⛔ Still one plain link per night: the pack is the picture, the tear happens on
      the night's own page. */
.shelf{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:34px 22px;align-items:start}
.pk{display:block;text-decoration:none;color:inherit;text-align:center;min-width:0}
.pk .cap{display:block;padding:11px 2px 0}
.pk .cap b{display:block;font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
font-size:17px;line-height:1.05;letter-spacing:.01em;color:var(--ink);overflow-wrap:anywhere}
.pk:hover .cap b{color:var(--pink-glow)}
.pk .cap i{display:block;font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
text-transform:uppercase;color:var(--pink-deep);margin-top:5px}
.shelf .empty{grid-column:1/-1}
.empty{padding:40px 0;color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.14em}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:2}
.foot a{color:var(--pink-glow);text-decoration:none}
@media (max-width:600px){
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;padding-top:22px}
  .pk .cap b{font-size:15px}
}
</style>
</head>
<body>
<div class="leopard-bar"></div>
<div class="wrap">
  <a class="back" href="../">&larr; 0FF THE PRINT</a>
  <h1>Event Photos</h1>
  <div class="sub">every night we shot &nbsp;·&nbsp; san antonio &nbsp;·&nbsp; find yours</div>
  <div class="shelf" id="list"><div class="empty">loading…</div></div>
  <div class="foot">
    Shot by 0FF THE PRINT &nbsp;·&nbsp; <a href="https://instagram.com/vamppsych" target="_blank" rel="noopener">@vamppsych</a><br>
    Want your night shot? DM the desk, or <a href="mailto:offtheprintcollective@gmail.com">offtheprintcollective@gmail.com</a>.<br>
    In one of these and want the full-res? DM, it's yours.
  </div>
</div>
<script>
(async () => {
  const el = document.getElementById('list');
  // ⛔ Nothing out of events.json goes in as HTML. Text is textContent, and a slug
  //    only becomes a URL after it matches the shape newevent.py writes.
  const SLUG = /^[a-z0-9][a-z0-9-]{0,80}$/;
  const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const say = (t) => { el.textContent = ''; el.appendChild(mk('div', 'empty', t)); };
  try {
    const d = await (await fetch('events.json', {cache:'no-cache'})).json();
    const items = (d.items || []).filter(e => e && SLUG.test(e.slug || ''));
    if (!items.length) { say('No events posted yet.'); return; }
    el.textContent = '';
    items.forEach(e => {
      const title = String(e.title || '');
      const a = mk('a', 'pk'); a.href = e.slug + '/';
      const pp = mk('span', 'pp');
      // the night's own wrapper, or the house pack if it has none yet
      const w = mk('img', 'pp-w'); w.alt = ''; w.width = 520; w.height = 878; w.loading = 'lazy'; w.decoding = 'async';
      w.addEventListener('error', () => { w.src = '../assets/cathedral/pack-house.webp'; }, { once: true });
      w.src = e.slug + '/pack.webp';
      pp.appendChild(w);
      pp.appendChild(mk('span', 'pp-t' + (title.length <= 7 ? ' short' : title.length > 16 ? ' long' : ''), title));
      pp.appendChild(mk('span', 'pp-d', e.date_short || ''));
      a.appendChild(pp);
      const cap = mk('span', 'cap');
      cap.appendChild(mk('b', '', e.venue || title));
      cap.appendChild(mk('i', '', (e.count | 0) + ' frames \u00b7 sealed'));
      a.appendChild(cap);
      el.appendChild(a);
    });
  } catch (err) {
    say('Could not load events.');
  }
})();
</script>
</body>
</html>
