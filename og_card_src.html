<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- PER-MEMBER OG card source. Rendered by ogcards.py, one file per card
     holder, into assets/og/<slug>.jpg. Placeholders: __NAME__ __SEAT__
     __FLAVOR__ __ART__ (a data: URI).

  ⛔ DO NOT point og:image at the raw card art instead of this. The art is 5:7
     portrait and every unfurler crops to about 1.91:1, which slices a band out
     of the middle and throws away the nameplate and the moves. This file is
     1200x630 so the crop is the identity crop. -->
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0a0a0d;position:relative;
  display:flex;align-items:center;gap:54px;padding:0 74px}
body::before{content:"";position:absolute;inset:0;
  background:radial-gradient(110% 62% at 78% -8%, rgba(255,121,198,.20), transparent 62%),
             radial-gradient(90% 50% at -8% 110%, rgba(47,107,255,.16), transparent 60%);}
.art{position:relative;flex:0 0 360px;height:504px;border-radius:20px;overflow:hidden;
  border:2px solid #23222b;box-shadow:0 24px 70px rgba(0,0,0,.62), 0 0 46px rgba(255,121,198,.20);}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.txt{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:18px}
.kick{font-family:"JetBrains Mono",monospace;color:#9a93a3;font-size:19px;letter-spacing:.34em;
  text-transform:uppercase}
h1{font-family:"Saira Condensed",sans-serif;font-style:italic;font-weight:900;line-height:.9;
  text-transform:uppercase;letter-spacing:-.005em;
  background:linear-gradient(180deg,#fff 8%,#f7b9dd 36%,#8f8a97 52%,#fff 62%,#f48fc8 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(255,121,198,.28));
  /* ⛔ The long names are the ones that break this. HAZE.DT NIGHTINGALE is 19
     characters and blew out of the box at a fixed size, so the size is set by
     ogcards.py per name rather than guessed once here. */
  font-size:__NAMESIZE__px}
.seat{font-family:"JetBrains Mono",monospace;color:#f4eef2;font-size:18px;letter-spacing:.2em;
  text-transform:uppercase;border:2px solid #23222b;border-radius:999px;padding:11px 26px;
  align-self:flex-start;background:linear-gradient(180deg,rgba(244,143,200,.14),rgba(47,107,255,.07))}
.seat b{color:#ff79c6;font-weight:600}
.flav{font-family:"Saira Condensed",sans-serif;font-style:italic;font-weight:900;font-size:31px;
  color:#c9c3cf;line-height:1.14;text-transform:uppercase;max-width:640px}
.leo{position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(90deg,#f48fc8,#f7b9dd 25%,#2f6bff 50%,#f48fc8 75%,#f7b9dd);}
</style></head>
<body>
  <div class="art"><img src="__ART__" alt=""></div>
  <div class="txt">
    <div class="kick">0FF THE PRINT &middot; San Antonio</div>
    <h1>__NAME__</h1>
    <div class="seat"><b>&#9670;</b> &nbsp;__SEAT__</div>
    <div class="flav">__FLAVOR__</div>
  </div>
  <div class="leo"></div>
</body></html>
