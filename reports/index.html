<style>
*{box-sizing:border-box}
:root{--bg:#f6f6f3;--fg:#141414;--muted:#5b5b57;--line:#d9d9d3;--card:#fff;--accent:#0b7fd6}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2ee;--muted:#a7a7a0;--line:#2b2b2b;--card:#1b1b1b;--accent:#4fb4ff;color-scheme:dark}}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif}
.band{background:#111;color:#fff;padding:28px max(16px,env(safe-area-inset-left,0px)) 26px max(16px,env(safe-area-inset-right,0px));background-image:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.07) 46px 58px)}
.in{max-width:860px;margin:0 auto}
h1{font-family:"Archivo",Arial,sans-serif;font-stretch:125%;font-weight:800;font-size:clamp(28px,5vw,40px);margin:0 0 4px}
.sub{color:#d8d8d2;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
h2{font-family:"Archivo",Arial,sans-serif;font-stretch:125%;font-weight:800;font-size:18px;margin:22px 0 10px}
a.r{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:inherit;text-decoration:none;margin:0 0 10px}
a.r:hover,a.r:focus-visible{border-color:var(--accent);outline:none}
a.r .t{font-weight:600} a.r .m{color:var(--muted);font-size:14px}
a.r .h{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="band"><div class="in"><h1>Reports</h1><p class="sub">Hours, timestamps, what got done. One page per day.</p></div></div>
<div class="wrap">
  <h2>Thrift @ The Warehouse</h2>
  <a class="r" href="/reports/thrift/2026-11-08/"><div class="t">Sunday, Nov 8, 2026 · Night market + $3 sale edit day</div><div class="m">17 videos cut, 27 photos finished · <span class="h">14 h 02 m</span> editing</div></a>
</div>
</body>
