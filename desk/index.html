<meta name="robots" content="noindex, nofollow">
<script>
/* THE DESK MOVED (Wave 2, call 3). Two consoles shared 37 tools and gave three
   answers to one card ask, so everything the old desk did lives on /board/ now:
   THE PAGE, and MEMBERS for who gets in, bans, fixes and their stuff. An old
   bookmark or link lands there. The hash rides along (#members, #members/<key>,
   #run:<id>), and the old ?s=<slug> story link becomes the board's ?mstory=.
   The board checks every value itself; this only drops anything odd-looking.
   No Supabase here on purpose: nothing on this page talks to the database. */
(function () {
  var to = '../board/';
  try {
    var s = new URLSearchParams(location.search).get('s');
    if (s && /^[a-z0-9-]{1,90}$/.test(s)) to += '?mstory=' + s;
    else if (/^#[A-Za-z0-9:\/_-]{1,80}$/.test(location.hash)) to += location.hash;
  } catch (e) {}
  location.replace(to);
})();
</script>
