<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Desk · 0FF THE PRINT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0d">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/auth.css">
<style>
  .post-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
    padding:15px 4px;border-bottom:1px solid var(--line)}
  .post-row.no-img{grid-template-columns:1fr}
  .post-row:last-child{border-bottom:0}
  .pthumb{width:56px;height:56px;border-radius:9px;background:#0d0c11 center/cover no-repeat;
    border:1px solid var(--line);flex:0 0 auto;object-fit:cover}
  .post-row .txt{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .post-row .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;
    margin-top:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .gone{opacity:.45}
  .pill.hidden{border-color:rgba(255,255,255,.18);color:var(--muted)}
  .pill.edited{border-color:rgba(255,255,255,.14);color:var(--muted);font-size:9px}
  .pill.pin{border-color:rgba(47,107,255,.5);color:#9db9ff}
  .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .acts .btn{width:auto;margin:0;min-height:40px;font-size:13px;padding:8px 15px}
  .more{background:none;border:0;color:var(--pink-glow);cursor:pointer;font-family:var(--f-mono);
    font-size:11px;padding:0;margin-top:4px}
  .undo{background:rgba(47,107,255,.1);border:1px solid rgba(47,107,255,.4);border-radius:9px;
    padding:11px 13px;margin-top:12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .undo .btn{width:auto;margin:0;font-size:13px;padding:7px 14px;min-height:0}
  .slug{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
  .broke{background:rgba(255,93,126,.08);border:1px solid rgba(255,93,126,.35);border-radius:10px;
    padding:14px;font-size:13px;color:#ffb3c4}
</style>
</head>
<body>
<div class="leopard-bar"></div>
<div class="wrap wide">
  <a class="back" href="../">&larr; 0FF THE PRINT</a>
  <h1>The Desk</h1>
  <div class="sub">who gets in &nbsp;·&nbsp; what stays up &nbsp;·&nbsp;
    <a href="targets/" style="color:var(--pink-glow);text-decoration:none;font-weight:600">THE HIT LIST &rarr;</a> &nbsp;·&nbsp;
    <a href="goals/" style="color:var(--pink-glow);text-decoration:none;font-weight:600">THE GOALS &rarr;</a></div>
  <div id="panel"><div class="empty">checking…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js?v=f1348482"></script>
<script src="../assets/js/desk.js?v=552a3c87"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const panel = $('panel');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };

  // Survives a re-render so the undo strip does not vanish under him.
  let lastBatch = null, lastBatchN = 0, lastBatchWho = '', lastRetired = null;

  if (!OTP.configured) {
    panel.innerHTML = `<div class="setup"><b>Backend not switched on yet</b>
      Run <code>schema.sql</code> in Supabase and fill in <code>supabase-config.js</code>.
      Full walkthrough is in <code>SUPABASE_SETUP.md</code>.</div>`;
    return;
  }
  const me = await OTP.me();
  if (!me) { location.href = '../join/'; return; }
  if (!me.profile?.is_admin) {
    panel.innerHTML = `<div class="card"><b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">Desk only.</b>
      <div class="note">Signed in as ${esc(me.user.email)}, but this page is the owner's.</div>
      <button class="btn ghost" id="out" type="button">Sign out</button></div>`;
    $('out').onclick = async () => { await OTP.signOut(); location.href = '../join/'; };
    return;
  }

  // Photos whose post went away. Draining on open means they clean themselves
  // up whenever he looks at the desk, instead of piling up on a storage bill.
  try { await OTP.drainOrphans(); } catch (e) { console.warn('orphan drain skipped:', e.message); }

  async function render() {
    const [pending, members, posts, orphans, wordEntries, rotTracks, memberStories, seedPosts, seedOvs, vidRows, siteOvs] = await Promise.all([
      OTP.pending(), OTP.members(), OTP.allPosts(40), OTP.orphanImages(),
      // .catch keeps the desk usable before migrations 008/009/014 have run
      OTP.deskWord ? OTP.deskWord().catch(() => []) : [],
      OTP.rotationAll ? OTP.rotationAll().catch(() => []) : [],
      OTP.deskStories ? OTP.deskStories().catch(() => []) : [],
      fetch('../content/take.json', { cache: 'no-cache' }).then(r => r.json()).then(d => d.items || []).catch(() => []),
      OTP.seedOverrides ? OTP.seedOverrides().catch(() => []) : [],
      OTP.videosAll ? OTP.videosAll().catch(() => []) : [],
      OTP.siteOverrides ? OTP.siteOverrides().catch(() => []) : [],
    ]);
    const nameOf = id => {
      const m = members.find(x => x.id === id);
      return m ? m.display_name : '?';
    };
    // videosAll reads the raw table, which has no link column: the public
    // `videos` view is what rebuilds the host. The desk rebuilds it the same
    // way so he can watch a submission BEFORE approving it.
    const vidLink = v => {
      // ⛔ NO `|| 'x'` fallback here. The public view builds the tiktok link as
      // '...@' || card_slug || '/video/...', and card_slug is NULLABLE while
      // Approve does not require one. NULL anywhere in that concat makes the
      // WHOLE link null, so the public tile is dead. Masking it here made his
      // preview look fine while the site was broken.
      const who = (members.find(x => x.id === v.submitted_by) || {}).card_slug;
      if (v.provider === 'tiktok' && !who) return '';
      if (v.provider === 'youtube')   return 'https://www.youtube.com/watch?v=' + v.vid;
      if (v.provider === 'tiktok')    return 'https://www.tiktok.com/@' + who + '/video/' + v.vid;
      if (v.provider === 'instagram') return 'https://www.instagram.com/reel/' + v.vid + '/';
      return '#';
    };
    const vidPending = vidRows.filter(v => !v.published);
    const vidLive = vidRows.filter(v => v.published);
    const seedRows = await Promise.all(seedPosts.map(async p => {
      const key = await OTP.seedKey(p.author, p.text);
      return { key, p, ov: seedOvs.find(o => o.key === key) || null };
    }));
    const staleOvs = seedOvs.filter(o => !seedRows.some(r => r.key === o.key));
    const storyPending = memberStories.filter(x => !x.published);
    const storyLive = memberStories.filter(x => x.published && !x.baked);
    const wordPending = wordEntries.filter(e => !e.published);
    const wordLive = wordEntries.filter(e => e.published);
    const rotPending = rotTracks.filter(t => !t.published);
    const rotLive = rotTracks.filter(t => t.published);

    const undoStrip = lastBatch
      ? `<div class="undo">Pulled ${lastBatchN} post${lastBatchN === 1 ? '' : 's'} by ${esc(lastBatchWho)}.
           <button class="btn ghost" id="undo" type="button">Put them back</button></div>`
      : '';

    panel.innerHTML = `
      <div class="card">
        <div class="who">signed in as <b>${esc(me.profile.display_name)}</b>
          <button class="btn ghost sm" id="out" type="button">Sign out</button></div>
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Waiting on you ${pending.length ? `<span class="pill wait">${pending.length}</span>` : ''}</b>
        ${pending.length ? pending.map(p => `
          <div class="person">
            <div><b>${esc(p.display_name)}</b>
              <div class="meta">${p.requested_slug ? 'asked for: ' + esc(p.requested_slug) : 'new, no card yet'}
                ${p.instagram && /^[A-Za-z0-9._]{1,30}$/.test(p.instagram)
                  ? `&nbsp;·&nbsp; <a href="https://www.instagram.com/${esc(p.instagram)}/" target="_blank" rel="noopener" style="color:var(--pink-glow)">@${esc(p.instagram)}</a>`
                  : ''}
                &nbsp;·&nbsp; asked ${when(p.created_at)}</div></div>
            <div class="row">
              <button class="btn ok sm" data-ok="${p.id}" type="button">Approve</button>
              ${p.requested_slug ? `<button class="btn ok sm" data-okcard="${p.id}" data-slug="${esc(p.requested_slug)}" type="button">Approve + give card</button>` : ''}
            </div>
          </div>`).join('') : '<div class="empty">nobody waiting</div>'}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Card holders</b>
        ${undoStrip}
        ${members.length ? members.map(p => `
          <div class="person">
            <div><b>${esc(p.display_name)}</b>
              <div class="meta"><span class="slug">${esc(p.card_slug || 'no card')}</span>
                ${p.instagram && /^[A-Za-z0-9._]{1,30}$/.test(p.instagram)
                  ? `<a href="https://www.instagram.com/${esc(p.instagram)}/" target="_blank" rel="noopener" style="color:var(--muted)">@${esc(p.instagram)}</a>`
                  : ''}
                ${p.is_admin ? '<span class="pill ok">DESK</span>' : ''}</div></div>
            <div class="row">
              <button class="btn ghost sm" data-card="${p.id}" data-cur="${esc(p.card_slug || '')}" type="button">Change card</button>
              ${p.is_admin ? '' : `<button class="btn bad sm" data-retire="${p.id}" data-name="${esc(p.display_name)}" type="button">Revoke + pull posts</button>`}
            </div>
          </div>`).join('') : '<div class="empty">nobody approved yet</div>'}
      </div>

      ${orphans.length ? `
      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Photos that would not go away</b>
        <div class="broke" style="margin-top:12px">These files should have gone when their post did. They are still up. Tap to try again.</div>
        ${orphans.map(o => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(o.object_name)}</b>
              <div class="meta">${esc(o.reason || 'no reason recorded')}</div></div>
            <div class="row"><button class="btn ghost sm" data-orphan="${esc(o.object_name)}" type="button">Try again</button></div>
          </div>`).join('')}
      </div>` : ''}

      ${(wordEntries.length || 1) ? `
      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          The Word${wordPending.length ? ' · waiting ' + wordPending.length : ''}</b>
        <div class="broke" style="margin-top:12px">Stories and entries go live only after you approve them.
          <a href="word/" style="color:var(--pink-glow)">Edit a story body &rarr;</a></div>
        ${storyPending.map(x => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(x.title)}</b>
              <span class="meta"> STORY from ${esc((x.profiles && x.profiles.display_name) || '?')}</span>
              <div class="meta" style="text-transform:none;letter-spacing:0">${esc(x.dek)}
                &nbsp;<a href="../word/live/?s=${esc(x.slug)}" target="_blank" rel="noopener" style="color:var(--pink-glow)">read it &rarr;</a></div></div>
            <div class="row">
              <button class="btn ok sm" data-st-ok="${x.id}" type="button">Approve</button>
              <button class="btn bad sm" data-st-del="${x.id}" type="button">Toss</button>
            </div>
          </div>`).join('')}
        ${storyLive.map(x => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(x.title)}</b>
              <span class="meta"> STORY · LIVE, unbaked</span></div>
            <div class="row">
              <button class="btn ghost sm" data-st-pull="${x.id}" type="button">Pull</button>
              <button class="btn ok sm" data-st-baked="${x.id}" type="button">Baked</button>
              <button class="btn bad sm" data-st-del="${x.id}" type="button">Delete</button>
            </div>
          </div>`).join('')}
        ${wordPending.map(e => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc((e.profiles && e.profiles.display_name) || '?')}</b>
              <span class="meta"> on ${esc(e.story_slug)}</span>
              <div class="meta" style="text-transform:none;letter-spacing:0">${esc(e.text)}</div></div>
            <div class="row">
              <button class="btn ok sm" data-we-ok="${e.id}" type="button">Approve</button>
              <button class="btn bad sm" data-we-del="${e.id}" type="button">Toss</button>
            </div>
          </div>`).join('') || '<div class="meta" style="margin-top:8px">Nothing waiting.</div>'}
        ${wordLive.length ? wordLive.map(e => `
          <div class="person gone-ok">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc((e.profiles && e.profiles.display_name) || '?')}</b>
              <span class="meta"> on ${esc(e.story_slug)} · ON THE WALL</span>
              <div class="meta" style="text-transform:none;letter-spacing:0">${esc(e.text.slice(0,120))}${e.text.length > 120 ? '…' : ''}</div></div>
            <div class="row">
              <button class="btn ghost sm" data-we-pull="${e.id}" type="button">Pull</button>
              <button class="btn bad sm" data-we-del="${e.id}" type="button">Delete</button>
            </div>
          </div>`).join('') : ''}
      </div>` : ''}

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          The Rotation${rotPending.length ? ' · waiting ' + rotPending.length : ''}</b>
        <div class="broke" style="margin-top:12px">Pull means no, it stays refused. Delete means try again later.</div>
        ${rotPending.map(t => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(t.title)}</b>
              <span class="meta"> · ${esc(t.artist)}</span>
              <div class="meta">from ${esc((t.profiles && t.profiles.display_name) || '?')}</div></div>
            <div class="row">
              <button class="btn ok sm" data-rt-ok="${t.id}" type="button">Approve</button>
              <button class="btn bad sm" data-rt-del="${t.id}" type="button">Toss</button>
            </div>
          </div>`).join('') || '<div class="meta" style="margin-top:8px">Nothing waiting.</div>'}
        ${rotLive.length ? rotLive.map(t => `
          <div class="person gone-ok">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(t.title)}</b>
              <span class="meta"> · ${esc(t.artist)} · ON ROTATION</span></div>
            <div class="row">
              <button class="btn ghost sm" data-rt-pull="${t.id}" type="button">Pull</button>
              <button class="btn bad sm" data-rt-del="${t.id}" type="button">Delete</button>
            </div>
          </div>`).join('') : ''}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          The Reel${vidPending.length ? ' · waiting ' + vidPending.length : ''}</b>
        <div class="broke" style="margin-top:12px">Videos are links, never uploads, so nothing here costs storage.
          Feature puts one at the front of the rail. Pull takes it off the site but keeps the row.</div>
        ${vidPending.map(v => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(v.title)}</b>
              <span class="meta"> · ${esc(v.provider)}</span>
              <div class="meta">from ${esc(nameOf(v.submitted_by))}
                ${vidLink(v) ? `&nbsp;·&nbsp; <a href="${esc(vidLink(v))}" target="_blank" rel="noopener" style="color:var(--pink-glow)">watch it first</a>` : '<span class="pill pulled">NO CARD SLUG, THIS TILE WILL BE DEAD</span>'}</div></div>
            <div class="row">
              <button class="btn ok sm" data-vd-ok="${v.id}" type="button">Approve</button>
              <button class="btn bad sm" data-vd-del="${v.id}" type="button">Toss</button>
            </div>
          </div>`).join('') || '<div class="meta" style="margin-top:8px">Nothing waiting.</div>'}
        ${vidLive.length ? vidLive.map(v => `
          <div class="person gone-ok">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(v.title)}</b>
              <span class="meta"> · ${esc(v.provider)} · UP${v.featured ? '' : ''}</span>
              ${v.featured ? '<span class="pill ok">FEATURED</span>' : ''}
              <div class="meta">${esc(nameOf(v.submitted_by))}
                &nbsp;·&nbsp; <a href="${esc(vidLink(v))}" target="_blank" rel="noopener" style="color:var(--muted)">open</a></div></div>
            <div class="row">
              <button class="btn ghost sm" data-vd-feat="${v.id}" data-on="${v.featured ? '1' : ''}" type="button">${v.featured ? 'Unfeature' : 'Feature'}</button>
              <button class="btn ghost sm" data-vd-pull="${v.id}" type="button">Pull</button>
              <button class="btn bad sm" data-vd-del="${v.id}" type="button">Delete</button>
            </div>
          </div>`).join('') : ''}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Front page edits${siteOvs.length ? ' · ' + siteOvs.length : ''}</b>
        <div class="broke" style="margin-top:12px">Everything you changed with a pencil on the homepage.
          The committed file is still the floor, so clearing one puts it straight back.</div>
        ${siteOvs.length ? siteOvs.map(o => `
          <div class="person">
            <div><b style="font-size:14px;font-style:normal;text-transform:none">${esc(o.section)} ${esc(o.item_key || '(whole section)')}</b>
              <div class="meta">${o.hidden ? 'HIDDEN' : esc(Object.keys(o.patch || {}).join(', ') || 'no fields')}
                &nbsp;·&nbsp; ${when(o.updated_at)}</div></div>
            <div class="row">
              <button class="btn ghost sm" data-so-clear="${esc(o.section)}|${esc(o.item_key || '')}" type="button">Back to the file</button>
            </div>
          </div>`).join('') : '<div class="meta" style="margin-top:8px">Nothing overridden. The site is running straight off git.</div>'}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          The seeds</b>
        <div class="broke" style="margin-top:12px">These live in the committed file, not the database.
          Hide or rewrite one here and the page obeys in seconds; bake.py writes it into git for good.</div>
        ${seedRows.map(r => `
          <div class="post-row no-img ${r.ov && r.ov.hidden ? 'gone' : ''}" data-seedkey="${r.key}">
            <div>
              <div class="txt">${esc((r.ov && r.ov.new_text) || r.p.text || '')}</div>
              <div class="meta">SEED · ${esc(r.p.author || '?')}
                ${r.p.pinned ? '<span class="pill pin">PINNED</span>' : ''}
                ${r.ov ? (r.ov.hidden ? '<span class="pill pulled">HIDDEN</span>' : '<span class="pill edited">EDITED</span>') : ''}</div>
              <div class="acts">
                <button class="btn ghost sm" data-seed-edit="${r.key}" type="button">Edit</button>
                <button class="btn ghost sm" data-seed-hide="${r.key}" data-on="${r.ov && r.ov.hidden ? '1' : ''}" type="button">${r.ov && r.ov.hidden ? 'Show' : 'Hide'}</button>
                ${r.ov ? `<button class="btn ghost sm" data-seed-clear="${r.key}" type="button">Back to the file</button>` : ''}
              </div>
              <div class="seed-editor" id="se-${r.key}" style="display:none;margin-top:10px">
                <textarea style="width:100%;min-height:120px;background:#0d0d12;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px">${esc((r.ov && r.ov.new_text) || r.p.text || '')}</textarea>
                <div class="acts">
                  <button class="btn ok sm" data-seed-save="${r.key}" type="button">Save</button>
                  <button class="btn ghost sm" data-seed-cancel="${r.key}" type="button">Cancel</button>
                </div>
              </div>
            </div>
          </div>`).join('') || '<div class="empty">no seed posts in the file</div>'}
        ${staleOvs.length ? `
          <div class="meta" style="margin-top:10px">Inert overrides (their seed changed in git):</div>
          ${staleOvs.map(o => `
            <div class="acts"><span class="slug">${o.key}</span>
              <button class="btn ghost sm" data-seed-clear="${o.key}" type="button">Clear</button></div>`).join('')}` : ''}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Every post</b>
        ${posts.length ? posts.map(p => {
          const pulled = !p.published;
          // published=true but the author got revoked means visitors cannot see it
          // even though the row says live. Without this he moderates blind.
          const hidden = p.published && p.author_approved === false;
          const full = p.text || '';
          const clipped = full.length > 400;
          return `<div class="post-row ${p.image_url ? '' : 'no-img'} ${pulled || hidden ? 'gone' : ''}" data-id="${p.id}">
            ${p.image_url
                ? (OTP.isVideo(p.image_url)
                    ? `<video class="pthumb" src="${esc(p.image_url)}" preload="metadata" muted playsinline></video>`
                    : `<div class="pthumb" data-bg="${esc(p.image_url)}"></div>`)
                : ''}
            <div>
              <div class="txt" data-full="${esc(full)}">${esc(clipped ? full.slice(0,400) + '…' : full)}</div>
              ${clipped ? `<button class="more" data-more="1" type="button">more</button>` : ''}
              <div class="meta">
                <b style="color:var(--ink);font-family:var(--f-body);font-size:12px">${esc(p.display_name || p.profiles?.display_name || '?')}</b>
                <span>${when(p.created_at)}</span>
                ${p.pinned ? '<span class="pill pin">PINNED</span>' : ''}
                ${p.edited_at ? '<span class="pill edited">EDITED</span>' : ''}
                ${pulled ? '<span class="pill" style="color:var(--bad);border-color:rgba(255,93,126,.45)">PULLED</span>' : ''}
                ${hidden ? '<span class="pill hidden">HIDDEN, author revoked</span>' : ''}
              </div>
              <div class="acts">
                <button class="btn ghost" data-edit="${p.id}" type="button">Edit</button>
                <button class="btn ghost" data-pin="${p.id}" data-on="${p.pinned ? '0' : '1'}" type="button">${p.pinned ? 'Unpin' : 'Pin'}</button>
                ${pulled
                  ? `<button class="btn ok" data-pub="${p.id}" data-on="1" type="button">Restore</button>`
                  : `<button class="btn bad" data-pub="${p.id}" data-on="0" type="button">Pull</button>`}
                <button class="btn bad" data-del="${p.id}" type="button">Delete</button>
              </div>
              <div class="msg" id="pm${p.id}"></div>
            </div>
          </div>`;
        }).join('') : '<div class="empty">no posts yet</div>'}
      </div>`;

    panel.querySelectorAll('.pthumb[data-bg]').forEach(el => {
      el.style.backgroundImage = 'url("' + el.dataset.bg + '")';
    });

    // render() sits in a finally, not the success path. "Approve + give card" is
    // two requests: if the approve commits and the card assignment throws
    // (somebody already holds it), skipping the re-render left the person
    // approved in the database while the screen still listed them as waiting,
    // with the pending count unchanged and both buttons live.
    const rerun = fn => async (ev) => {
      const b = ev.currentTarget; b.disabled = true;
      try { await fn(b); }
      catch (e) { alert(e.message || 'That did not go through.'); }
      finally { render(); }
    };

    $('out').onclick = async () => { await OTP.signOut(); location.href = '../join/'; };
    if ($('undo')) $('undo').onclick = rerun(async () => {
      // Retiring does TWO writes: it revokes the person AND pulls their posts.
      // Undo used to reverse only the second, so the posts came back "published"
      // while their author was still unapproved, and the public feed hides an
      // unapproved author's posts. Nothing actually returned to the site, and the
      // confirm dialog had promised it would. Re-approve FIRST, then republish.
      if (lastRetired) await OTP.setApproved(lastRetired, true);
      await OTP.restoreBatch(lastBatch);
      lastBatch = null; lastRetired = null;
    });

    panel.querySelectorAll('[data-seed-hide]').forEach(b => b.onclick = rerun(async b => {
      const key = b.dataset.seedHide;
      const cur = seedOvs.find(o => o.key === key);
      await OTP.setSeedOverride(key, { hidden: !(cur && cur.hidden), newText: cur && cur.new_text });
    }));
    panel.querySelectorAll('[data-seed-clear]').forEach(b => b.onclick = rerun(b => OTP.clearSeedOverride(b.dataset.seedClear)));
    panel.querySelectorAll('[data-seed-edit]').forEach(b => b.onclick = () => {
      const ed = $('se-' + b.dataset.seedEdit);
      if (ed) ed.style.display = ed.style.display === 'none' ? 'block' : 'none';
    });
    panel.querySelectorAll('[data-seed-cancel]').forEach(b => b.onclick = () => {
      const ed = $('se-' + b.dataset.seedCancel);
      if (ed) ed.style.display = 'none';
    });
    panel.querySelectorAll('[data-seed-save]').forEach(b => b.onclick = rerun(async b => {
      const key = b.dataset.seedSave;
      const ed = $('se-' + key);
      const v = ed ? ed.querySelector('textarea').value.trim() : '';
      if (!v) throw new Error('Empty is Hide, not Edit.');
      const cur = seedOvs.find(o => o.key === key);
      await OTP.setSeedOverride(key, { hidden: !!(cur && cur.hidden), newText: v });
    }));
    panel.querySelectorAll('[data-st-ok]').forEach(b => b.onclick = rerun(b => OTP.setStoryPublished(b.dataset.stOk, true)));
    panel.querySelectorAll('[data-st-pull]').forEach(b => b.onclick = rerun(b => OTP.setStoryPublished(b.dataset.stPull, false)));
    panel.querySelectorAll('[data-st-baked]').forEach(b => b.onclick = rerun(async b => {
      if (!confirm('Baked means the story is committed as a real page. Only tap this after bake.py ran and pushed.')) return;
      await OTP.setStoryBaked(b.dataset.stBaked);
    }));
    panel.querySelectorAll('[data-st-del]').forEach(b => b.onclick = rerun(async b => {
      // A story is somebody's whole write-up, not a 500-char entry.
      if (!confirm('Toss the whole story? The text goes with it and there is no undo.')) return;
      await OTP.deleteStory(b.dataset.stDel);
    }));
    panel.querySelectorAll('[data-we-ok]').forEach(b => b.onclick = rerun(b => OTP.setEntryPublished(b.dataset.weOk, true)));
    panel.querySelectorAll('[data-we-pull]').forEach(b => b.onclick = rerun(b => OTP.setEntryPublished(b.dataset.wePull, false)));
    panel.querySelectorAll('[data-we-del]').forEach(b => b.onclick = rerun(b => OTP.deleteEntry(b.dataset.weDel)));
    panel.querySelectorAll('[data-rt-ok]').forEach(b => b.onclick = rerun(b => OTP.setTrackPublished(b.dataset.rtOk, true)));
    panel.querySelectorAll('[data-rt-pull]').forEach(b => b.onclick = rerun(b => OTP.setTrackPublished(b.dataset.rtPull, false)));
    panel.querySelectorAll('[data-rt-del]').forEach(b => b.onclick = rerun(b => OTP.deleteTrack(b.dataset.rtDel)));

    panel.querySelectorAll('[data-vd-ok]').forEach(b => b.onclick = rerun(b => OTP.setVideoPublished(b.dataset.vdOk, true)));
    panel.querySelectorAll('[data-vd-pull]').forEach(b => b.onclick = rerun(b => OTP.setVideoPublished(b.dataset.vdPull, false)));
    panel.querySelectorAll('[data-vd-feat]').forEach(b => b.onclick = rerun(b => OTP.setVideoFeatured(b.dataset.vdFeat, !b.dataset.on)));
    panel.querySelectorAll('[data-vd-del]').forEach(b => b.onclick = rerun(b => OTP.deleteVideo(b.dataset.vdDel)));
    panel.querySelectorAll('[data-so-clear]').forEach(b => b.onclick = rerun(b => {
      const [section, key] = String(b.dataset.soClear).split('|');
      return OTP.clearSiteOverride(section, key || '');
    }));
    panel.querySelectorAll('[data-ok]').forEach(b => b.onclick = rerun(b => OTP.setApproved(b.dataset.ok, true)));
    panel.querySelectorAll('[data-okcard]').forEach(b => b.onclick = rerun(async b => {
      await OTP.setApproved(b.dataset.okcard, true);
      await OTP.setCard(b.dataset.okcard, b.dataset.slug);
    }));
    panel.querySelectorAll('[data-card]').forEach(b => b.onclick = async () => {
      const v = prompt('Which card? Leave it empty to take the card off them.', b.dataset.cur || '');
      if (v === null) return;
      try { await OTP.setCard(b.dataset.card, v.trim()); render(); }
      catch (e) { alert(e.message); }
    });
    panel.querySelectorAll('[data-retire]').forEach(b => b.onclick = async () => {
      const name = b.dataset.name;
      if (!confirm('Revoke ' + name + ' and pull everything they posted? You can put it back.')) return;
      b.disabled = true;
      try {
        const batch = await OTP.retireMember(b.dataset.retire);
        const n = (await OTP.allPosts(200)).filter(p => p.pull_batch === batch).length;
        lastBatch = batch; lastBatchN = n; lastBatchWho = name;
        lastRetired = b.dataset.retire;
        render();
      } catch (e) { alert(e.message); b.disabled = false; }
    });

    panel.querySelectorAll('[data-orphan]').forEach(b => b.onclick = rerun(async b => {
      await OTP.deleteImage('/storage/v1/object/public/posts/' + b.dataset.orphan);
    }));

    panel.querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
      const t = b.previousElementSibling;
      t.textContent = t.dataset.full; b.remove();
    });

    panel.querySelectorAll('[data-pin]').forEach(b => b.onclick = rerun(b => OTP.setPinned(b.dataset.pin, b.dataset.on === '1')));

    panel.querySelectorAll('[data-pub]').forEach(b => b.onclick = async (ev) => {
      const btn = ev.currentTarget;
      const on = btn.dataset.on === '1';
      if (!on && !confirm('Pull this post off the site? You can put it back.')) return;
      btn.disabled = true;
      try { await OTP.setPublished(btn.dataset.pub, on); render(); }
      catch (e) { alert(e.message); btn.disabled = false; }
    });

    panel.querySelectorAll('[data-del]').forEach(b => b.onclick = async (ev) => {
      const btn = ev.currentTarget;
      if (!confirm('Delete this for good? The photo goes with it and there is no undo button.')) return;
      if (!confirm('Last check. This one does not come back.')) return;
      btn.disabled = true;
      try { await OTP.deletePost(btn.dataset.del); render(); }
      catch (e) { alert(e.message); btn.disabled = false; }
    });

    panel.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const row = b.closest('.post-row');
      const id = b.dataset.edit;
      const holder = row.querySelector('.txt').parentElement;
      const current = row.querySelector('.txt').dataset.full;
      holder.innerHTML = `
        <textarea id="de${id}" maxlength="800">${esc(current)}</textarea>
        <div class="acts">
          <button class="btn" data-save="${id}" type="button">Save</button>
          <button class="btn ghost" data-cancel="1" type="button">Never mind</button>
        </div>
        <div class="msg" id="pm${id}"></div>`;
      holder.querySelector('[data-cancel]').onclick = () => render();
      holder.querySelector('[data-save]').onclick = async (ev) => {
        const btn = ev.currentTarget;
        const t = document.getElementById('de' + id).value.trim();
        if (!t) return;
        btn.disabled = true; btn.textContent = 'Saving…';
        try { await OTP.updatePost(id, { text: t }); render(); }
        catch (e) {
          const m = document.getElementById('pm' + id);
          m.textContent = e.message; m.className = 'msg show err';
          btn.disabled = false; btn.textContent = 'Save';
        }
      };
    });
  }

  render();
})();
</script>
</body>
</html>
