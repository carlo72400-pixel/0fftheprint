<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Goals · 0FF THE PRINT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0d">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/auth.css">
<style>
  .goal{font-family:var(--f-display);font-style:italic;text-transform:uppercase;font-size:30px;
    line-height:1.08;margin-top:6px}
  .why{font-size:13.5px;line-height:1.55;color:var(--muted);margin-top:10px}
  .barwrap{margin-top:16px}
  .barlabel{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;
    letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .barlabel b{color:var(--ink);font-size:13px}
  .bar{height:14px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#0d0c11}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#7a2740,var(--pink-glow));
    border-radius:999px;transition:width .6s}
  .bar i.gold{background:linear-gradient(90deg,#5a4a12,#e8c35a)}
  .rung{display:grid;grid-template-columns:26px 1fr;gap:11px;padding:13px 2px;
    border-bottom:1px solid var(--line);align-items:start}
  .rung:last-child{border-bottom:0}
  .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:12px;margin-top:1px}
  .rung.done .dot{border-color:rgba(88,214,141,.6);color:#9fe8bd}
  .rung.now .dot{border-color:var(--pink-glow);color:var(--pink-glow);box-shadow:0 0 9px rgba(255,93,155,.35)}
  .rung .t{font-size:14px;font-weight:600}
  .rung.done .t{color:#9fe8bd}
  .rung.now .t{color:var(--ink)}
  .rung.ahead .t{color:var(--muted)}
  .rung .n{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
  .stat{border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
  .stat b{font-family:var(--f-display);font-style:italic;font-size:24px;display:block}
  .stat span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .stat.booked b{color:#9fe8bd}
  .stat.pitched b{color:var(--pink-glow)}
  .bookedlist{font-size:13px;margin-top:10px;line-height:1.6}
  .bookedlist b{color:#9fe8bd}
  ul.week{margin:8px 0 0 18px;font-size:13.5px;line-height:1.75}
  .side{font-size:13.5px;line-height:1.7;margin-top:6px}
  .side b{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:block;margin-top:9px}
  .upd{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:16px}
  h2.sec{font-family:var(--f-display);font-style:italic;text-transform:uppercase;font-size:20px;margin:0 0 4px}
</style>
</head>
<body>
<div class="leopard-bar"></div>
<div class="wrap wide">
  <a class="back" href="../">&larr; The Desk</a>
  <a class="back" href="../targets/" style="float:right">THE HIT LIST &rarr;</a>
  <h1>The Goals</h1>
  <div class="sub">what we are building &nbsp;·&nbsp; desk eyes only</div>
  <div id="panel"><div class="empty">checking…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../supabase-config.js?v=f1348482"></script>
<script src="../../assets/js/desk.js?v=128f5421"></script>
<script>
(async () => {
  const panel = document.getElementById('panel');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  if (!OTP.configured) { panel.innerHTML = '<div class="setup"><b>Backend not configured.</b></div>'; return; }
  const me = await OTP.me();
  if (!me) { location.href = '../../join/'; return; }
  if (!me.profile?.is_admin) {
    panel.innerHTML = `<div class="card"><b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">Desk only.</b>
      <div class="note">Signed in as ${esc(me.user.email)}, but this page is the owner's.</div>
      <button class="btn ghost" id="out" type="button">Sign out</button></div>`;
    document.getElementById('out').onclick = async () => { await OTP.signOut(); location.href = '../../join/'; };
    return;
  }

  const c = OTP.sb();
  const [metaR, listR] = await Promise.all([
    c.from('hitlist_meta').select('v').eq('k', 'goals').maybeSingle(),
    c.from('hitlist').select('name,status,tier'),
  ]);
  let g = null;
  try { g = JSON.parse(metaR.data?.v || 'null'); } catch (e) {}
  if (!g) { panel.innerHTML = '<div class="card"><div class="note">No goals data loaded yet. Tell Claude to update the scoreboard.</div></div>'; return; }

  const rows = listR.data || [];
  const n = s => rows.filter(r => r.status === s).length;
  const bookedNames = rows.filter(r => r.status === 'booked').map(r => r.name);
  const pct = (v, m) => Math.max(2, Math.min(100, Math.round(v / m * 100)));

  panel.innerHTML = `
    <div class="card">
      <div class="goal">${esc(g.goal)}</div>
      <div class="why">${esc(g.why)}</div>
      <div class="barwrap">
        <div class="barlabel"><span>${esc(g.month)} BOOKED &nbsp;<b>$${g.booked.toLocaleString()}</b> / $${g.bar.toLocaleString()}</span><span>${pct(g.booked, g.bar)}%</span></div>
        <div class="bar"><i style="width:${pct(g.booked, g.bar)}%"></i></div>
      </div>
      <div class="barwrap">
        <div class="barlabel"><span>COLLECTED &nbsp;<b>$${g.collected.toLocaleString()}</b></span><span>${pct(g.collected, g.bar)}%</span></div>
        <div class="bar"><i class="gold" style="width:${pct(g.collected, g.bar)}%"></i></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">The ladder</h2>
      ${(g.rungs || []).map(r => `
        <div class="rung ${esc(r.state)}">
          <div class="dot">${r.state === 'done' ? '✓' : r.state === 'now' ? '●' : ''}</div>
          <div><div class="t">${esc(r.n)}</div><div class="n">${esc(r.note || '')}</div></div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h2 class="sec">The hunt, live</h2>
      <div class="stats">
        <div class="stat"><b>${rows.length}</b><span>doors</span></div>
        <div class="stat"><b>${n('to hit')}</b><span>to hit</span></div>
        <div class="stat pitched"><b>${n('pitched')}</b><span>pitched</span></div>
        <div class="stat booked"><b>${n('booked')}</b><span>booked</span></div>
      </div>
      ${bookedNames.length
        ? `<div class="bookedlist"><b>Booked:</b> ${bookedNames.map(esc).join(' · ')}</div>`
        : `<div class="bookedlist" style="color:var(--muted)">Nothing booked off the list yet. Right track = the pitched number moving every week.</div>`}
    </div>

    <div class="card">
      <h2 class="sec">This week</h2>
      <ul class="week">${(g.week || []).map(w => `<li>${esc(w)}</li>`).join('')}</ul>
    </div>

    <div class="card">
      <h2 class="sec">Side goals</h2>
      <div class="side">${(g.side || []).map(s => `<b>${esc(s.k)}</b>${esc(s.v)}`).join('')}</div>
      <div class="upd">scoreboard updated ${esc(g.updated)} · say "update the scoreboard" and it refreshes from the ledger</div>
    </div>`;
})();
</script>
</body>
</html>
