<meta property="og:description" content="VIRGOSGATEWAY holds a card at 0FF THE PRINT. San Antonio underground media house.">

<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/auth.css">
<style>
  /* THE BACK OF THE CARD.
     The front is the card they build at /card/. This is what is printed on the
     other side, and almost none of it is typed: it assembles out of the posts,
     songs, stories and clips they already made. */
  /* ⛔ NOT .back. auth.css already owns `.back`, which is the "left arrow, back
     to the site" link: mono, uppercase, .2em tracking, muted, AND
     display:inline-block. Putting it on the page wrapper uppercased every post
     on the page and shrank the whole column to shrink-to-fit instead of 760. */
  .wrap.cardback{max-width:760px;padding:0 0 90px}
  .pad{padding:0 18px}

  /* ---- the header. Their own card art, blurred, is the wallpaper. ---- */
  .hero{position:relative;padding:26px 18px 22px;overflow:hidden;
    border-bottom:1px solid var(--line)}
  .hero .wall{position:absolute;inset:-40px;background:#0d0c11 center/cover no-repeat;
    filter:blur(34px) saturate(1.25) brightness(.5);opacity:.8;transform:scale(1.1)}
  .hero .wall::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,10,13,.35),rgba(10,10,13,.95))}
  .hero .in{position:relative;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .shot{width:132px;flex:0 0 auto;aspect-ratio:3/4;border-radius:12px;
    background:#0d0c11 center/cover no-repeat;border:1px solid rgba(255,255,255,.18);
    box-shadow:0 14px 44px rgba(0,0,0,.6)}
  .shot.bare{display:flex;align-items:center;justify-content:center;
    font-family:var(--f-display);font-style:italic;font-weight:900;font-size:46px;color:#3a3744}
  /* ⛔ NOT .who and NOT .sh. auth.css already owns `.who` (a mono 11px muted
     flex row for the signed-in-as line) and this file already used `.sh` for
     the bottom sheet, so a section heading called `sh` inherited the sheet's
     panel background, its 20px radius and its padding. Two collisions, one
     stylesheet, both invisible until something looked wrong on screen. */
  .nameblock{flex:1 1 240px;min-width:0}
  .nameblock h1{font-size:clamp(30px,8.5vw,52px);margin:0}
  .tag{font-size:15px;line-height:1.45;color:#ded7e2;margin-top:8px;max-width:44ch}
  .tag.none{color:#5f5b6b;font-style:italic}
  /* the link row: the second thing on the page after their name, because this
     page is the URL they put in their bio */
  .linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lk{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:8px 14px;
    border-radius:11px;background:rgba(10,10,13,.62);border:1px solid var(--line);
    color:var(--ink);transition:border-color .14s,transform .14s;min-width:96px}
  .lk:hover{border-color:var(--pink-deep);transform:translateY(-2px)}
  .lk b{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--pink-glow);font-weight:500}
  .lk span{font-size:13px;line-height:1.2;overflow-wrap:anywhere}
  @media(max-width:520px){ .lk{flex:1 1 auto;min-width:0} }
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted);
    text-decoration:none;background:rgba(10,10,13,.5)}
  a.chip:hover{color:var(--pink-glow);border-color:var(--pink-deep)}
  .chip.hot{color:var(--pink-glow);border-color:var(--pink-deep)}

  /* ---- sections ---- */
  section{margin-top:30px}
  h2.hd{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
    font-size:21px;line-height:1;margin:0 0 3px;display:flex;align-items:baseline;gap:9px}
  h2.hd span{font-family:var(--f-mono);font-style:normal;font-size:10px;letter-spacing:.2em;
    color:var(--muted)}
  .bio{font-size:15.5px;line-height:1.7;color:#ded7e2;white-space:pre-wrap;
    overflow-wrap:anywhere;margin-top:12px}
  .bio.none{color:#5f5b6b;font-style:italic;white-space:normal}
  .bio-src{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#5f5b6b;margin-top:10px}

  .songs{display:grid;gap:9px;margin-top:13px}
  .song{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .song .art{width:52px;height:52px;border-radius:8px;background:#0d0c11 center/cover no-repeat;
    border:1px solid var(--line)}
  .song .t{font-weight:600;font-size:14px;line-height:1.3}
  .song .a{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
    text-transform:uppercase;margin-top:4px}
  .song .play{background:none;border:1px solid var(--line);border-radius:999px;color:var(--pink-glow);
    width:38px;height:38px;font-size:14px;cursor:pointer;flex:0 0 auto}
  .song .play:hover{border-color:var(--pink-deep)}
  .song.open{grid-template-columns:1fr}
  .song iframe{width:100%;height:80px;border:0;border-radius:10px;display:block}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:13px}
  .post{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column}
  .post .im{width:100%;aspect-ratio:1;background:#0d0c11 center/cover no-repeat;
    border-bottom:1px solid var(--line)}
  .post .tx{padding:10px 11px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;
    overflow-wrap:anywhere;flex:1}
  .post .when{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:#5f5b6b;
    text-transform:uppercase;padding:0 11px 11px}
  .post .pin{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--pink-glow)}

  .rows{display:grid;gap:9px;margin-top:13px}
  .row2{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    text-decoration:none;color:var(--ink)}
  .row2:hover{border-color:var(--pink-deep)}
  .row2.no-im{grid-template-columns:1fr;padding:13px 14px}
  .row2 .im{width:74px;height:74px;background:#0d0c11 center/cover no-repeat}
  .row2 .tt{padding:11px 13px 11px 0}
  .row2.no-im .tt{padding:0}
  .row2 .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted)}
  .row2 .n{font-weight:600;font-size:14.5px;line-height:1.3;margin-top:4px}
  .row2 .d{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:4px}

  .none-yet{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#5f5b6b;border:1px dashed var(--line);border-radius:12px;padding:18px;margin-top:13px;
    text-align:center}

  /* ---- the owner's pencil. Only ever two fields. ---- */
  .pen{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);
    font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    padding:5px 11px;cursor:pointer;margin-left:auto}
  .pen:hover{color:var(--pink-glow);border-color:var(--pink-deep)}
  .yours{background:rgba(255,121,198,.07);border:1px solid rgba(255,121,198,.3);border-radius:14px;
    padding:15px 16px;margin-top:22px}
  .yours b{font-family:var(--f-display);font-style:italic;font-size:19px;text-transform:uppercase;
    display:block;color:var(--pink)}
  .yours .note{margin-top:6px}
  .yours .row{margin-top:13px}
  .yours .btn{width:auto;margin:0;font-size:13px;padding:8px 15px}

  /* THE EXCHANGE. Dye blue rather than pink: the pink block above it is what
     they type, this one is what the house owes them, and two identical panels
     stacked read as one long panel nobody finishes. */
  .yours.exch{background:rgba(47,107,255,.07);border-color:rgba(47,107,255,.32)}
  .yours.exch b{color:#9db9ff}
  .yours.exch .note + .note{margin-top:9px}
  .ex-state{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink);margin-top:13px;padding-top:12px;border-top:1px solid rgba(47,107,255,.25)}
  /* the state mark on a date's kicker line */
  .hx{border-radius:999px;padding:2px 7px;border:1px solid currentColor;font-size:8.5px;
    letter-spacing:.14em;white-space:nowrap}
  .hx.asking{color:#ffd479}
  .hx.onlist{color:#ff9ed6}
  .hx.shot{color:#6ee7a8}

  .sh-back{position:fixed;inset:0;background:rgba(6,5,9,.8);z-index:200;display:flex;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
  .sh{background:var(--panel);border:1px solid var(--line);border-bottom:0;
    border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:640px){.sh-back{align-items:center;padding:24px}
    .sh{border-radius:18px;border-bottom:1px solid var(--line)}}
  .sh h3{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
    font-size:25px;color:var(--pink)}
  .count{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);
    text-align:right;margin-top:5px}
  .count.over{color:var(--bad)}
  .say{font-family:var(--f-mono);font-size:11px;color:var(--pink-glow);margin-top:12px;min-height:15px}
  .say.bad{color:var(--bad)}
  .foot{display:flex;gap:8px;margin-top:18px}
  .foot .btn{flex:1;margin:0}

  footer.back-foot{margin-top:44px;padding:22px 18px calc(28px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);text-align:center}
  footer.back-foot a{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);text-decoration:none}
  footer.back-foot a:hover{color:var(--pink-glow)}
</style>
