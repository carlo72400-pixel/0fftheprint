<style>/*fe*/
  :root{--f-logo:'Cinzel',serif}
  .wrap.cal{max-width:820px;padding:24px 18px 100px}
  /* THE CLOCK ROOM (10/3). Same room the More tab on the homepage opens on, same
     silver frame. The title sits low so the clock face stays readable above it. */
  .leopard-bar{height:3px;background:linear-gradient(90deg,transparent,#1d1e23 12%,#2e3038 50%,#1d1e23 88%,transparent);opacity:.55}
  .cal-hero{position:relative;height:clamp(170px,30vw,250px);overflow:hidden;border:1px solid rgba(180,139,166,0.2);
    background:#0a0a0d url('../assets/cathedral/room-more.webp') 50% 46%/cover no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px 26px;text-align:center}
  .cal-hero::before{content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(10,10,13,.3) 0,rgba(10,10,13,0) 30%,rgba(10,10,13,.25) 58%,rgba(10,10,13,.85) 100%)}
  .cal-hero::after{content:'';position:absolute;inset:0;pointer-events:none;border:13px solid transparent;
    border-image:url('../assets/cathedral/frame-panel.webp') 112 / 46px / 0 stretch}
  .cal-hero > *{position:relative;z-index:1}
  .head-lock{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:0}
  .head-lock img{width:auto;height:40px;display:block;filter:drop-shadow(0 0 8px rgba(255,121,198,.5))}
  .head-lock h1{font-family:var(--f-logo);font-weight:900;font-size:clamp(21px,4.6vw,30px);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-t,var(--ink));line-height:1;text-shadow:0 2px 14px #000,0 0 3px #000;margin:0}
  .cal-hero .sub{margin-top:9px;color:var(--pink-t,var(--pink));font-size:11px;letter-spacing:.26em;text-shadow:0 1px 8px #000}
  @media (max-width:520px){ .cal-hero{padding-bottom:22px} .cal-hero::after{border-width:10px;border-image-width:34px} .head-lock img{height:32px}
    .cal-hero .sub{font-size:11px;letter-spacing:.14em;text-wrap:balance} }

  .addbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .addbar .btn{width:auto;margin:0}
  .wholine{font-family:var(--f-mono);font-size:11px;color:var(--muted-t,var(--muted));letter-spacing:.06em;
    margin-top:12px;line-height:1.7}
  .wholine a{color:var(--pink-glow-t,var(--pink-glow))}
  .addbar + .wholine{margin-top:10px}
  .d-acts a.btn{text-decoration:none}

  .month{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
    font-size:26px;line-height:1;color:var(--ink-t,var(--ink));margin:34px 0 2px;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .month span{font-family:var(--f-mono);font-style:normal;font-size:11px;letter-spacing:.2em;
    color:var(--muted-t,var(--muted))}
  .month + .rule{height:1px;margin-bottom:6px;
    background:linear-gradient(90deg,rgba(44,46,53,0.34),rgba(111,9,68,0.5) 30%,rgba(44,46,53,0.08) 100%)}

  .d-row.flash{animation:rowflash 1.4s ease-out}
  @keyframes rowflash{0%{background:rgba(111,9,68,0.22)}100%{background:transparent}}

  .d-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:15px 4px;
    border-bottom:1px solid var(--line-l,var(--line));align-items:start}
  .d-row:last-child{border-bottom:0}
  /* the date is a little arched window, the same shape as the tab cards on the homepage */
  .d-when{text-align:center;border:1px solid rgba(180,139,166,0.26);border-radius:32px 32px 3px 3px;padding:11px 4px 7px;
    background:linear-gradient(180deg,rgba(111,9,68,0.14),rgba(111,9,68,0) 62%),#0d0c11}
  .d-ic{width:52px;height:52px;display:block;align-self:center;filter:drop-shadow(0 5px 10px rgba(0,0,0,.6))}
  .d-row.pulled .d-ic{opacity:.5}
  @media (max-width:520px){ .d-row{grid-template-columns:58px 1fr auto;gap:11px} .d-ic{width:40px;height:40px;align-self:start;margin-top:2px} }
  .d-when .m{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--pink-glow-t,var(--pink-glow));
    text-transform:uppercase;display:block}
  .d-when .d{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:26px;
    line-height:1.05;display:block;color:var(--ink-t,var(--ink))}
  .d-when .dow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted-t,var(--muted));
    text-transform:uppercase;display:block;margin-top:2px}
  .d-body{min-width:0}
  .d-title{font-size:16.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
  .d-title a{color:var(--ink-t,var(--ink));text-decoration:none;border-bottom:1px solid rgba(255,16,153,0.4)}
  .d-title a:hover{color:var(--pink-glow-t,var(--pink-glow))}
  .d-meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted-t,var(--muted));
    margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;text-transform:uppercase}
  .d-note{font-size:13.5px;color:#ddd7e2;line-height:1.55;margin-top:8px;overflow-wrap:anywhere}
  .kind{border:1px solid var(--line-l,var(--line));border-radius:0;padding:3px 9px;font-size:11px;
    letter-spacing:.16em;color:var(--muted-t,var(--muted))}
  .kind.show{color:#faa3d5;border-color:rgba(255,16,153,0.45)}
  .kind.drop,.kind.release{color:#a2c2fa;border-color:rgba(0,87,238,0.45)}
  .kind.festival{color:#fade9e;border-color:rgba(255,183,16,0.4)}
  .by{color:var(--pink-glow-t,var(--pink-glow));text-decoration:none}
  a.by:hover{text-decoration:underline}
  .d-acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .d-acts .btn{width:auto;margin:0;font-size:12px;padding:6px 12px;min-height:0}
  .pulled{opacity:.5}
  .pill.off{border-color:rgba(166,166,166,0.18);color:var(--muted-t,var(--muted))}
  /* THE EXCHANGE. Same three colours the grid uses, so a date reads the same
     whether somebody meets it in the month or in the list. */
  .pill.house{text-decoration:none}
  .pill.house.asking{color:#fade9e;border-color:rgba(255,183,16,0.4)}
  .pill.house.onlist{color:#faa3d5;border-color:rgba(255,16,153,0.5)}
  .pill.house.shot{color:#a7eef1;border-color:rgba(37,213,219,0.5)}
  a.pill.house.shot:hover{background:rgba(20,89,91,0.12)}

  .past-toggle{background:none;border:1px solid var(--line-l,var(--line));border-radius:999px;color:var(--muted-t,var(--muted));
    font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 16px;cursor:pointer;margin-top:34px}
  .past-toggle:hover{color:var(--pink-glow-t,var(--pink-glow));border-color:var(--pink-deep-l,var(--pink-deep))}

  .empty-cal{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#e3e2e6;border:1px dashed var(--line-l,var(--line));border-radius:12px;padding:26px;text-align:center;
    margin-top:22px}
</style>

  <!-- WAVE 2, CALL 6: THE RUN IS THE ONE PLACE. This page is where card holders put a date up (and ask the house to

  <p class="wholine" id="run-line">The house&rsquo;s nights and the roster&rsquo;s own shows, in one list. Every flyer in SA, San Marcos and Austin is in the Coven, for members. <a href="../wall/">Get in. All it takes is an @.</a></p>
