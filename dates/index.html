<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Calendar · 0FF THE PRINT</title>
<meta name="description" content="Every date that matters, in one place. Shows, drops and releases from the 0FF THE PRINT roster.">
<meta name="theme-color" content="#0a0a0d">
<meta property="og:site_name" content="0FF THE PRINT">
<meta property="og:title" content="The Calendar · 0FF THE PRINT">
<meta property="og:description" content="Every date that matters, in one place.">
<meta property="og:image" content="https://0fftheprint.com/assets/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700..900&family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/auth.css">
<link rel="stylesheet" href="../assets/css/calendar.css">
<style>
  :root{--f-logo:'Cinzel',serif}
  .wrap.cal{max-width:820px;padding:24px 18px 100px}
  .head-lock{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .head-lock img{width:44px;height:44px;display:block}
  .head-lock b{font-family:var(--f-logo);font-weight:900;font-size:26px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink);line-height:1}

  .addbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .addbar .btn{width:auto;margin:0}
  .wholine{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;
    margin-top:12px;line-height:1.7}
  .wholine a{color:var(--pink-glow)}

  .month{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
    font-size:26px;line-height:1;color:var(--ink);margin:34px 0 2px;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .month span{font-family:var(--f-mono);font-style:normal;font-size:10px;letter-spacing:.2em;
    color:var(--muted)}
  .month + .rule{height:1px;background:var(--line);margin-bottom:6px}

  .d-row.flash{animation:rowflash 1.4s ease-out}
  @keyframes rowflash{0%{background:rgba(255,121,198,.22)}100%{background:transparent}}

  .d-row{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:15px 4px;
    border-bottom:1px solid var(--line);align-items:start}
  .d-row:last-child{border-bottom:0}
  .d-when{text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px 4px;
    background:#0d0c11}
  .d-when .m{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;color:var(--pink-glow);
    text-transform:uppercase;display:block}
  .d-when .d{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:26px;
    line-height:1.05;display:block;color:var(--ink)}
  .d-when .dow{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;color:var(--muted);
    text-transform:uppercase;display:block;margin-top:2px}
  .d-body{min-width:0}
  .d-title{font-size:16.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
  .d-title a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(255,121,198,.4)}
  .d-title a:hover{color:var(--pink-glow)}
  .d-meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);
    margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;text-transform:uppercase}
  .d-note{font-size:13.5px;color:#ded7e2;line-height:1.55;margin-top:8px;overflow-wrap:anywhere}
  .kind{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:9px;
    letter-spacing:.16em;color:var(--muted)}
  .kind.show{color:#ff9ed6;border-color:rgba(255,121,198,.45)}
  .kind.drop,.kind.release{color:#9db9ff;border-color:rgba(47,107,255,.45)}
  .kind.festival{color:#ffd479;border-color:rgba(255,212,121,.4)}
  .by{color:var(--pink-glow);text-decoration:none}
  .by:hover{text-decoration:underline}
  .d-acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .d-acts .btn{width:auto;margin:0;font-size:12px;padding:6px 12px;min-height:0}
  .pulled{opacity:.5}
  .pill.off{border-color:rgba(255,255,255,.18);color:var(--muted)}
  /* THE EXCHANGE. Same three colours the grid uses, so a date reads the same
     whether somebody meets it in the month or in the list. */
  .pill.house{text-decoration:none}
  .pill.house.asking{color:#ffd479;border-color:rgba(255,212,121,.4)}
  .pill.house.onlist{color:#ff9ed6;border-color:rgba(255,121,198,.5)}
  .pill.house.shot{color:#6ee7a8;border-color:rgba(110,231,168,.5)}
  a.pill.house.shot:hover{background:rgba(110,231,168,.12)}

  .past-toggle{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);
    font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 16px;cursor:pointer;margin-top:34px}
  .past-toggle:hover{color:var(--pink-glow);border-color:var(--pink-deep)}

  .empty-cal{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#5f5b6b;border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;
    margin-top:22px}
</style>
</head>
<body>
<div class="leopard-bar"></div>
<div class="wrap cal">
  <a class="back" href="../">&larr; 0FF THE PRINT</a>
  <div class="head-lock">
    <img src="../assets/mark.svg" alt="" width="44" height="44">
    <b>The Calendar</b>
  </div>
  <div class="sub">every date that matters &nbsp;·&nbsp; in one place</div>
  <div id="panel"><div class="note" style="margin-top:22px">reading the run&hellip;</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js?v=f1348482"></script>
<script src="../assets/js/desk.js?v=ffaa8999"></script>
<script src="../assets/js/calendar.js?v=b7cd53c5"></script>
<script src="../assets/js/dates.js?v=22d44c35"></script>
</body>
</html>
