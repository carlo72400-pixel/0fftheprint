<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex">
<link rel="canonical" href="https://0fftheprint.com/">
<noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
<script>
(function () {
  var go = function () { location.replace('../'); };
  var t = setTimeout(go, 1500);
  if (!('serviceWorker' in navigator)) { clearTimeout(t); go(); return; }
  navigator.serviceWorker.getRegistrations()
    .then(function (rs) { return Promise.all(rs.filter(function (r) { return /\/play\/$/.test(r.scope); }).map(function (r) { return r.unregister(); })); })
    .catch(function () {})
    .then(function () { clearTimeout(t); go(); });
})();
</script>
