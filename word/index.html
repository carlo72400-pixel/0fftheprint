<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Issue · 0FF THE PRINT</title>
<meta name="description" content="The contents of the current issue. Departments, running order, every drop numbered.">
<meta name="theme-color" content="#0a0a0d">
<meta property="og:type" content="website">
<meta property="og:title" content="THE ISSUE · 0FF THE PRINT">
<meta property="og:description" content="Departments, running order, every drop numbered.">
<meta property="og:image" content="https://0fftheprint.com/assets/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--panel:#121218;--line:#23222b;--ink:#f4eef2;--muted:#9a93a3;
--pink:#f7b9dd;--pink-deep:#f48fc8;--pink-glow:#ff79c6;--dye-blue:#2f6bff;
--f-display:'Saira Condensed',sans-serif;--f-body:'Inter',system-ui,sans-serif;--f-mono:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.leopard-bar{height:14px;background:linear-gradient(90deg,var(--pink-deep),var(--pink) 25%,var(--dye-blue) 50%,var(--pink-deep) 75%,var(--pink))}
.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 70px}
.back{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:22px}
.back:hover{color:var(--pink-glow)}
h1{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
font-size:clamp(38px,8vw,88px);line-height:.92;letter-spacing:-.01em;
background:linear-gradient(180deg,#fff 10%,var(--pink) 45%,#8f8a97 60%,var(--pink-deep) 96%);
-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(255,121,198,.22))}
.sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.line{font-size:18px;line-height:1.6;color:var(--ink);margin-top:16px;max-width:46ch}
.stamp{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;
text-transform:uppercase;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
color:var(--muted);margin-top:18px}
.stamp.out{color:#0a0a0d;background:var(--pink-glow);border-color:var(--pink-glow)}

/* A contents page is a running order, so it is a LIST with the numbers showing,
   never a grid of equal cards. The department head is the thing you scan for. */
.dept{margin-top:52px}
.dept-head{display:flex;align-items:baseline;gap:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.dept-name{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
  font-size:clamp(24px,4.4vw,38px);line-height:1;color:var(--pink-glow)}
.dept-count{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.piece{display:grid;grid-template-columns:74px 1fr;gap:16px;align-items:start;
  padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.piece:hover .p-title{color:var(--pink-glow)}
.p-thumb{width:74px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#000;border:1px solid var(--line);display:block}
.p-num{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--muted)}
.p-title{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;
  font-size:clamp(20px,3.4vw,28px);line-height:1.02;margin-top:3px;transition:color .15s}
.p-dek{color:var(--muted);font-size:14px;line-height:1.55;margin-top:6px;max-width:60ch}
@media(min-width:700px){.piece{grid-template-columns:104px 1fr;gap:20px}.p-thumb{width:104px}}
.empty{color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;padding:40px 0}
.foot{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);line-height:2}
.foot a{color:var(--pink-glow);text-decoration:none}
.past{margin-top:44px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.past a{color:var(--pink-glow);text-decoration:none;margin-right:14px}
</style>
</head>
<body>
<div class="leopard-bar"></div>
<div class="wrap">
  <a class="back" href="../">&larr; 0FF THE PRINT</a>
  <div id="head"></div>
  <div id="body"><div class="empty">loading…</div></div>
  <div class="foot">
    Every drop gets a number. &nbsp;·&nbsp;
    <a href="https://instagram.com/vamppsych" target="_blank" rel="noopener">@vamppsych</a><br>
    Pitch the desk: <a href="mailto:offtheprintcollective@gmail.com">offtheprintcollective@gmail.com</a>
  </div>
</div>
<script>
(async () => {
  const head = document.getElementById('head'), body = document.getElementById('body');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Only same-directory-ish relative links belong on a contents page. Anything
  // else on a desk card (an outside READ link) is not part of an issue.
  const rel = u => { const v = String(u ?? '');
    return /^[\w./-]+\/?$/.test(v) && !v.startsWith('/') ? v : ''; };
  const grab = async (p) => { try {
      const r = await fetch(p, {cache:'no-cache'}); return r.ok ? await r.json() : null;
    } catch (e) { return null; } };
  try {
    const [iss, dsk] = await Promise.all([grab('../content/issues.json'), grab('../content/desk.json')]);
    const desk = (dsk && dsk.items) || [];
    const issues = (iss && iss.items) || [];
    if (!desk.length) { body.innerHTML = '<div class="empty">Nothing on the desk yet.</div>'; return; }

    const byNum = new Map(desk.map(x => [x.num, x]));
    const deptOf = x => x.dept || 'story';
    const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
    const labelOf = d => (desk.find(x => deptOf(x) === d && x.dept_name) || {}).dept_name || cap(d);

    // Newest issue that has anything in it, else fall back to the whole catalog
    // so this page is never blank before the first issue closes.
    const current = issues.find(i => (i.running_order || []).length);
    let groups, title, sub, line = '', stamp = '';

    if (current) {
      title = current.title || ('ISSUE ' + current.id);
      sub = (current.status === 'out' ? 'out ' : 'assembling &nbsp;·&nbsp; ')
          + esc(current.date_short || '');
      line = current.line || '';
      stamp = current.status === 'out'
        ? '<div class="stamp out">Out now</div>'
        : '<div class="stamp">In progress</div>';
      const order = (current.departments || []).length
        ? current.departments
        : [...new Set((current.running_order || []).map(n => deptOf(byNum.get(n) || {})))];
      groups = order.map(d => [d, (current.running_order || [])
        .map(n => byNum.get(n)).filter(x => x && deptOf(x) === d)]).filter(g => g[1].length);
    } else {
      title = 'THE WORD';
      sub = 'everything the house has published';
      groups = [...new Set(desk.map(deptOf))]
        .map(d => [d, desk.filter(x => deptOf(x) === d)]);
    }

    head.innerHTML = `<h1>${esc(title)}</h1><div class="sub">${sub}</div>`
      + (line ? `<p class="line">${esc(line)}</p>` : '') + stamp;

    body.innerHTML = groups.map(([d, items]) => `
      <section class="dept">
        <div class="dept-head">
          <div class="dept-name">${esc(labelOf(d))}</div>
          <div class="dept-count">${items.length} ${items.length === 1 ? 'piece' : 'pieces'}</div>
        </div>
        ${items.map(it => {
          // ⛔ This page lives at /word/, but desk.json links are written
          //    relative to the SITE ROOT ("word/<slug>/"). The thumb already
          //    gets the ../ hop; without the same hop here every piece link
          //    resolves to /word/word/<slug>/ and 404s. Verified by fetching
          //    the resolved href, not by looking at the DOM.
          const href = rel(it.link), th = rel(it.thumb);
          return `<a class="piece" href="${esc(href ? '../' + href : '#')}">
            ${th ? `<img class="p-thumb" src="${esc('../' + th)}" alt="" loading="lazy" decoding="async">`
                 : `<span class="p-thumb"></span>`}
            <div>
              <div class="p-num">${esc(it.num || '')}${it.date ? ' &nbsp;·&nbsp; ' + esc(it.date) : ''}</div>
              <div class="p-title">${esc(it.title || '')}</div>
              ${it.dek ? `<div class="p-dek">${esc(it.dek)}</div>` : ''}
            </div></a>`;
        }).join('')}
      </section>`).join('');

    const past = issues.filter(i => i !== current && (i.running_order || []).length);
    if (past.length) {
      body.insertAdjacentHTML('beforeend',
        '<div class="past">Back issues: ' + past.map(i =>
          `<a href="#" data-issue="${esc(i.id)}">${esc(i.title || i.id)}</a>`).join('') + '</div>');
    }
  } catch (err) {
    body.innerHTML = '<div class="empty">Could not load the issue.</div>';
  }
})();
</script>
</body>
</html>
